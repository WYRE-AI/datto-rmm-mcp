spec:
  name: datto-rmm-mcp
  services:
  - name: datto-rmm-mcp
    github:
      repo: WYRE-AI/datto-rmm-mcp
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
    # GitHub PAT (read:packages) used at build time to install the private
    # @wyre-technology/* dependency from GitHub Packages. Passed to the
    # Dockerfile's `ARG GITHUB_TOKEN`. Set this as an encrypted SECRET in the
    # App Platform UI before the first deploy, or the build fails with npm 401.
    - key: GITHUB_TOKEN
      scope: BUILD_TIME
      type: SECRET
    - key: MCP_TRANSPORT
      value: "http"
      scope: RUN_TIME
    - key: NODE_ENV
      value: "production"
      scope: RUN_TIME
    - key: DATTO_API_KEY
      type: SECRET
      scope: RUN_AND_BUILD_TIME
    - key: DATTO_API_SECRET
      type: SECRET
      scope: RUN_AND_BUILD_TIME
    - key: DATTO_PLATFORM
      type: SECRET
      scope: RUN_AND_BUILD_TIME
