name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # PR-time gate for the release image's `platforms:` (#115). Each
  # architecture builds natively on its own runner (no QEMU, so arm64 stays
  # fast), and the image is started once to prove it runs there. Nothing is
  # pushed. Mirrors autotask-mcp's test workflow.
  docker-build:
    name: Docker build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image for ${{ matrix.platform }}
        run: docker build --platform ${{ matrix.platform }} --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} -t datto-rmm-mcp:test .

      - name: Verify the image runs on ${{ matrix.platform }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint node datto-rmm-mcp:test \
            -e "console.log('node ' + process.version + ' on ' + process.arch)"

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # This job also pushes :latest, like the release workflow. It builds the
      # same platforms so a main push never replaces the multi-arch :latest
      # with an amd64-only one (#115). QEMU lets buildx emulate arm64 here.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Dockerfile takes GITHUB_TOKEN as a plain build ARG (not a
          # BuildKit secret mount) so the same Dockerfile also works on
          # one-click platforms like DigitalOcean App Platform that inject
          # build-time env vars but don't support --mount=type=secret. This
          # was never actually wired here — the step used to write a
          # .npmrc.docker file and pass it via secret-files, which the
          # Dockerfile never consumed (it only reads ${GITHUB_TOKEN}), so
          # every image build failed npm ci with a 401. build-args is what
          # the Dockerfile has always expected.
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
